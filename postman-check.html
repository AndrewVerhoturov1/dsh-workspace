<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка Postman</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }
    main {
      width: min(90vw, 28rem);
      padding: 2rem;
      text-align: center;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 1rem;
      box-shadow: 0 0.75rem 2rem color-mix(in srgb, CanvasText 10%, transparent);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 0.65rem;
      padding: 0.8rem 1.2rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: ButtonFace;
      color: ButtonText;
      outline-offset: 0.2rem;
    }

    button:focus-visible {
      outline: 0.2rem solid Highlight;
    }
    #status {
      min-height: 1.5em;
      margin: 1.25rem 0 0;
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <h1 id="page-title">Проверка Postman</h1>
    <button id="check-button" type="button" aria-describedby="status">Запустить проверку</button>
    <p id="status" role="status" aria-live="polite">Готов к проверке</p>
  </main>

  <script>
    const button = document.getElementById('check-button');
    const status = document.getElementById('status');
    button.addEventListener('click', () => {
      button.textContent = 'Postman работает';
      status.textContent = 'Postman работает';
    });
  </script>
</body>
</html>
