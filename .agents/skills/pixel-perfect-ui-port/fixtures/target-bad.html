<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI verifier fixture</title>
  <style>
    html, body { margin: 0; padding: 0; background: #f3f4f6; }
    .frame { padding: 50px 60px; }
    #upgrade {
      box-sizing: border-box;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 240px;
      height: 64px;
      padding: 12px 24px;
      border: 2px solid #1b4e93;
      border-radius: 10px;
      background: #3274c8;
      color: #ffffff;
      font: 600 16px/20px Arial, sans-serif;
      letter-spacing: 0.2px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <main class="frame"><button type="button" id="upgrade">UPGRADE</button></main>
</body>
</html>
