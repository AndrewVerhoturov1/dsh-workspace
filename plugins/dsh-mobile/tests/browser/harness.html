<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH mobile rc.2 synthetic browser harness</title>
<style>
  html,body{margin:0;background:#eee;font:13px system-ui}
  #fixture{position:relative;width:320px;height:730px;margin:0 auto;border:1px solid #888;overflow:hidden}
  #error{white-space:pre-wrap;color:#b00;font:11px monospace}
</style></head><body>
<div id="fixture"><div id="mount"></div></div><pre id="error" role="alert"></pre>
<script>
window.__ModuleLoader__={mode:'queue',pendingQueue:[],load(reg){this.pendingQueue.push(reg)}}
window.__fixturesReady=false;window.__fixtureCalls=[]
window.addEventListener('error',e=>document.getElementById('error').textContent+=(e.message||String(e))+'\n')
window.addEventListener('unhandledrejection',e=>document.getElementById('error').textContent+=(e.reason?.stack||e.reason)+'\n')
</script>
<script src="/rc2-client-modules.js"></script>
<script src="/mobile-client.js"></script>
<script type="module" src="/harness.js"></script>
</body></html>
