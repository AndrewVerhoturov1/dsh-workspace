<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WP-018 E2E PASS</title>
</head>
<body>
  <h1>WP-018 E2E PASS</h1>
  <button id="check" type="button">Проверить</button>
  <br>
  <button id="red-check" type="button" style="background-color: red; color: white;">Красная проверка</button>
  <br>
  <button id="green-check" type="button" style="background-color: green; color: white;">Зелёная проверка</button>
  <p id="green-result" hidden>Зелёная кнопка работает</p>
  <p id="red-result" hidden>Красная кнопка работает</p>
  <p id="result" hidden>Postman работает</p>
  <script>
    document.getElementById('check').addEventListener('click', function () {
      document.getElementById('result').hidden = false;
    });

    document.getElementById('red-check').addEventListener('click', function () {
      document.getElementById('red-result').hidden = false;
    });

    document.getElementById('green-check').addEventListener('click', function () {
      document.getElementById('green-result').hidden = false;
    });
  </script>
</body>
</html>
