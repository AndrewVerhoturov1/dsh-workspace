<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WP-018 E2E PASS</title>
  <style>
    .continue-button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      background: #2563eb;
      color: #fff;
      font: 600 15px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.24);
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
    }

    .continue-button:hover {
      background: #1d4ed8;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    .continue-button:active {
      background: #1e40af;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.22);
      transform: translateY(1px) scale(0.99);
    }

    .continue-button:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <h1>WP-018 E2E PASS</h1>
  <button id="check" class="continue-button" type="button">Продолжить</button>
  <p id="pink-result" hidden>Розовая кнопка работает</p>
  <p id="purple-result" hidden>Фиолетовая кнопка работает</p>
  <p id="green-result" hidden>Зелёная кнопка работает</p>
  <p id="red-result" hidden>Красная кнопка работает</p>
  <p id="result" hidden>Postman работает</p>
  <script>
    document.getElementById('check').addEventListener('click', function () {
      document.getElementById('result').hidden = false;
    });
  </script>
</body>
</html>
