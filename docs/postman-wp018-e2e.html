<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WP-018 E2E PASS</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f0eee7;
      --ink: #11110f;
      --muted: #77746b;
      --accent: #ff5533;
      --line: rgba(17, 17, 15, 0.18);
      --shadow: rgba(17, 17, 15, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
    }

    body::before {
      width: min(68vw, 860px);
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    body::after {
      inset: 24px;
      border: 1px solid var(--line);
    }

    .stage {
      width: min(1180px, calc(100vw - 96px));
      min-height: min(680px, calc(100svh - 96px));
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: 1fr auto;
      align-items: end;
      gap: clamp(36px, 8vw, 128px);
      position: relative;
      padding: clamp(24px, 4vw, 56px);
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      background: var(--ink);
    }

    .stage::before {
      width: 10px;
      height: 10px;
      top: 0;
      left: 0;
    }

    .stage::after {
      width: 1px;
      height: 72px;
      top: 0;
      right: 0;
    }

    h1 {
      grid-column: 1 / -1;
      align-self: start;
      margin: 0;
      max-width: 9ch;
      font-size: clamp(64px, 12vw, 176px);
      font-weight: 740;
      line-height: 0.82;
      letter-spacing: -0.075em;
      text-wrap: balance;
    }

    .action {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: clamp(24px, 5vw, 72px);
      align-items: center;
      border-top: 1px solid var(--ink);
      padding-top: 22px;
    }

    #check {
      appearance: none;
      justify-self: end;
      min-width: min(100%, 280px);
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      padding: 18px 58px 18px 26px;
      position: relative;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 16px 34px var(--shadow);
      transition:
        transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 180ms ease,
        background-color 180ms ease,
        color 180ms ease;
    }

    #check::after {
      content: "↗";
      position: absolute;
      top: 50%;
      right: 13px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: var(--ink);
      font-size: 18px;
      line-height: 1;
      transform: translateY(-50%);
      transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #check:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 46px var(--shadow);
    }

    #check:hover::after {
      transform: translateY(-50%) rotate(45deg);
    }

    #check:active {
      transform: translateY(0) scale(0.985);
      box-shadow: 0 8px 20px var(--shadow);
    }

    #check:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    #result {
      grid-row: 1;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #result:not([hidden])::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 10px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: 1px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 720px) {
      body::after {
        inset: 12px;
      }

      .stage {
        width: calc(100vw - 48px);
        min-height: calc(100svh - 48px);
        grid-template-columns: 1fr;
        padding: 22px 14px;
      }

      h1 {
        font-size: clamp(58px, 20vw, 108px);
      }

      .action {
        grid-template-columns: 1fr;
      }

      #check {
        justify-self: stretch;
        min-width: 0;
      }

      #result {
        grid-row: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #check,
      #check::after {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <h1>WP-018 E2E PASS</h1>
    <div class="action">
      <p id="result" hidden>Postman работает</p>
      <button id="check" type="button">Продолжить</button>
    </div>
  </main>
  <p id="pink-result" hidden>Розовая кнопка работает</p>
  <p id="purple-result" hidden>Фиолетовая кнопка работает</p>
  <p id="green-result" hidden>Зелёная кнопка работает</p>
  <p id="red-result" hidden>Красная кнопка работает</p>
  <script>
    document.getElementById('check').addEventListener('click', function () {
      document.getElementById('result').hidden = false;
    });
  </script>
</body>
</html>
