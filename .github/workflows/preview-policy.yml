name: Preview Branch Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  preview-branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR branch route
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          echo "Base: $BASE_BRANCH"
          echo "Head: $HEAD_BRANCH"

          if [[ "$BASE_BRANCH" == "main" ]]; then
            if [[ "$HEAD_BRANCH" == "main" || "$HEAD_BRANCH" == "preview" ]]; then
              echo "FAIL: ordinary PR into main requires a temporary task head, not '$HEAD_BRANCH'." >&2
              exit 1
            fi
            echo "PASS: temporary task branch targets main."
            exit 0
          fi

          if [[ "$BASE_BRANCH" == "preview" ]]; then
            echo "FAIL: preview is stable-only; PRs targeting preview are forbidden." >&2
            exit 1
          fi

          echo "FAIL: unsupported PR base '$BASE_BRANCH'. Ordinary task PRs target main; stable preview has no PR route." >&2
          exit 1
