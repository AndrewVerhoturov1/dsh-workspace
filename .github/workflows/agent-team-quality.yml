# Active CI for the vendored Andrew fork; no DSH installation or live services.
name: Agent Team quality

on:
  pull_request:
    branches: [preview, main]
    paths:
      - 'plugins/dsh-agent-team-by-andrew/**'
      - '.github/workflows/agent-team-quality.yml'
  push:
    branches: [preview, main]
    paths:
      - 'plugins/dsh-agent-team-by-andrew/**'
      - '.github/workflows/agent-team-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/dsh-agent-team-by-andrew
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@9.15.4 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check:whitespace
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run audit:pack
