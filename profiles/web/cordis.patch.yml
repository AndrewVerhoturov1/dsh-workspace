# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- insert:
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: !!js >-
            `Bearer ${process.env.GITHUB_TOKEN}`
        failOnStartupError: false
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: npx
        args:
          - '-y'
          - '@playwright/mcp@latest'
          - '--config'
          - !!js process.env.USERPROFILE + '/.dsh/profiles/web/playwright-mcp.config.json'
        env: {}
        cwd: !!js process.cwd()
        failOnStartupError: false
    - id: mcp-vuda
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: vuda
        transport: stdio
        command: npx
        args:
          - '-y'
          - 'visual-ui-debug-agent-mcp@1.1.0'
        env:
          VUDA_BROWSER_PROVIDER: local
          DOTENV_CONFIG_PATH: !!js >-
            (process.env.DSH_HOME || process.env.USERPROFILE + '/.dsh') + '/.agents/skills/pixel-perfect-ui-port/references/vuda-empty.config'
        cwd: !!js >-
          process.env.DSH_HOME || (process.env.USERPROFILE + '/.dsh')
        failOnStartupError: false
- id: agent-instructions
  disabled: false
  config:
    maxBytes: 65536
- id: tokenledger
  disabled: true
# Explicit user-requested local development policy, 2026-10-02.
- id: postman-bridge
  config:
    localDevelopment: true
