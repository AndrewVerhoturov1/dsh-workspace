# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- insert:
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: !!js >-
            `Bearer ${process.env.GITHUB_TOKEN}`
        failOnStartupError: false
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: npx
        args:
          - '-y'
          - '@playwright/mcp@latest'
          - '--config'
          - !!js process.env.USERPROFILE + '/.dsh/profiles/web/playwright-mcp.config.json'
        env: {}
        cwd: !!js process.cwd()
        failOnStartupError: false
    - id: preset-postman-leader
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: postman-leader
        name: Postman Leader
        description: Supervisor that delegates substantial work to ChatGPT Web through a fixed Luna Postman Bridge.
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Postman Leader. You are the supervisor and reviewer, not the primary executor.
                Think about the user's goal, inspect available read-only evidence, decide what to delegate, and verify the returned result.
                Delegate substantial research, analysis, implementation, or artifact creation through postman_bridge.
                Choose @PostmanAsk for text research/review and @Postman for durable ZIP/artifact work. Use --chat <REQ> when the next delegation belongs to the same proven ChatGPT conversation.
                Do not attempt repository mutation yourself. Do not bypass postman_bridge with direct Postman transport tools or generic subagents.
                Treat postman_bridge.result as the trusted transport authority and decide the next delegation yourself.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

- id: agent-instructions
  disabled: false
  config:
    maxBytes: 65536
- id: tokenledger
  disabled: true
